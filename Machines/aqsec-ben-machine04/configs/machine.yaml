machine:
  id: aqsec-ben-machine04
  name: "aqsec-ben-machine04"

  download:
    url: "https://download.vulnhub.com/beelzebub/Beelzebub.zip"
    archive_name: "Beelzebub.zip"

    # Hashes published by VulnHub
    md5: "BAC51D7645855EB6A45F90F5273A34F2"
    sha1: "C033AEB91D81E08640EDB0B163CBDC27AE75D98E"

  archive:
    # Beelzebub: 1 is listed as VirtualBox OVA.
    # The download is ZIP and should contain an OVA.
    # If the ZIP contains OVF/VMDK directly, the extractor also handles that.
    type: "zip"
    nested_type: "ova"

  disk:
    source_format: "vmdk"
    search_glob: "*.vmdk"
    runtime_format: "qcow2"
    runtime_name: "disk.qcow2"
    convert_to_runtime: true

  vm:
    architecture: "x86_64"
    acceleration: "auto"
    memory_mb: 2048
    vcpus: 2
    nic_model: "e1000"

  network:
    dhcp: true

  # Main expected ports for this target.
  # Guest SSH is remapped to host 2222 because Ubuntu host keeps port 22.
  ports:
    - {guest: 22, protocol: tcp, service: ssh}
    - {guest: 80, protocol: tcp, service: http}

  readiness:
    boot_wait_seconds: 10
    timeout_seconds: 1200
    interval_seconds: 5
    probes:
      - {type: tcp, external_port_for_guest: 80}
      - {type: ssh_banner, external_port_for_guest: 22}
