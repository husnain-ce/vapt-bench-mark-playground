machine:
  id: aqsec-ben-machine03
  name: "aqsec-ben-machine03"

  download:
    url: "https://download.vulnhub.com/venom/venom.zip"
    archive_name: "venom.zip"

    # Hashes published by VulnHub
    md5: "E02F7781D4EC766D4F5B22C3DDE59AAB"
    sha1: "9811194076C50717A9A31B5A1FD73195D3DA09B2"

  archive:
    # Venom: 1 is listed as VirtualBox OVA.
    # The download is ZIP and should contain an OVA.
    # If the ZIP contains OVF/VMDK directly, the extractor also handles that.
    type: "zip"
    nested_type: "ova"

  disk:
    source_format: "vmdk"
    search_glob: "*.vmdk"
    runtime_format: "qcow2"
    runtime_name: "disk.qcow2"
    convert_to_runtime: true

  vm:
    architecture: "x86_64"
    acceleration: "auto"
    memory_mb: 2048
    vcpus: 2
    nic_model: "e1000"

  network:
    dhcp: true

  # Main expected ports.
  # Guest SSH is remapped to host 2222 because Ubuntu host keeps port 22.
  ports:
    - {guest: 22, protocol: tcp, service: ssh}
    - {guest: 80, protocol: tcp, service: http}

  readiness:
    boot_wait_seconds: 10
    timeout_seconds: 1200
    interval_seconds: 5
    probes:
      - {type: tcp, external_port_for_guest: 80}
      - {type: ssh_banner, external_port_for_guest: 22}
