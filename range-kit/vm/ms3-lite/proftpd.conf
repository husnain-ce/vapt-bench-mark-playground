# MS3-lite ProFTPd 1.3.5 (vulnerable, CVE-2015-3306). Runs as www-data so the
# mod_copy SITE CPFR/CPTO primitive can write straight into the 0777 Apache
# DocumentRoot (/var/www/html). No off-box exposure: bound on the container's
# aqira-range interface only (compose publishes no host ports).
ServerName            "MS3-lite FTP"
ServerType            standalone
DefaultServer         on
Port                  21
UseIPv6               off
Umask                 022
MaxInstances          20
User                  www-data
Group                 www-data
DefaultRoot           /var/www/html
RequireValidShell     off
WtmpLog               off

# mod_copy is compiled in statically in this build; its SITE CPFR/CPTO handlers
# are reachable pre-auth in 1.3.5 (the CVE).
<Limit LOGIN>
  AllowAll
</Limit>
