# Aqira Cyber Range — reverse proxy for web playgrounds.
# Each vulnerable web app is bound to 127.0.0.1:<port>; nginx fronts it on :80
# by Host header. Range domains resolve to 127.0.0.1 via /etc/hosts.
# Managed centrally — do NOT edit from range agents.

map $http_upgrade $range_conn_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name juice.range.example.com;
    location / { proxy_pass http://127.0.0.1:8101; include /etc/nginx/conf.d/aqira-range-proxy.inc; }
}
server {
    listen 80;
    server_name dvwa.range.example.com;
    location / { proxy_pass http://127.0.0.1:8102; include /etc/nginx/conf.d/aqira-range-proxy.inc; }
}
server {
    listen 80;
    server_name webgoat.range.example.com;
    # WebGoat serves under /WebGoat
    location / { proxy_pass http://127.0.0.1:8103; include /etc/nginx/conf.d/aqira-range-proxy.inc; }
}
