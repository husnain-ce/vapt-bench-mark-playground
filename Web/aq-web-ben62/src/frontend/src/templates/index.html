<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timezone Converter</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Header Section -->
    <div class="text-center py-6">
        <h1 class="text-4xl font-semibold">Timezones Converter</h1>
    </div>

    <!-- Timezone Clocks -->
    <div class="flex flex-wrap justify-center gap-8 mb-12">
        {% for timezone, time in timezone_times.items() %}
        <div class="bg-white shadow-lg p-6 rounded-lg max-w-xs overflow-hidden">
            <h2 class="text-xl font-semibold whitespace-nowrap overflow-hidden text-ellipsis">{{ timezone }}</h2>
            <p id="time_{{ timezone }}" class="text-3xl whitespace-nowrap overflow-hidden text-ellipsis">{{ time }}</p>
        </div>
        {% endfor %}
    </div>

    <!-- Time Conversion Form -->
    <div class="flex justify-center py-6">
        <form id="convertForm" class="bg-white p-8 rounded-lg shadow-lg w-11/12 sm:w-10/12 md:w-1/2 lg:w-1/3 xl:w-1/4">
            <div class="mb-4">
                <label for="from_zone" class="block text-lg">From Timezone</label>
                <select id="from_zone" name="from_zone" class="w-full p-2 border border-gray-300 rounded">
                    {% for timezone in all_timezones %}
                    <option value="{{ timezone }}" class="truncate">{{ timezone }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="to_zone" class="block text-lg">To Timezone</label>
                <select id="to_zone" name="to_zone" class="w-full p-2 border border-gray-300 rounded">
                    {% for timezone in all_timezones %}
                    <option value="{{ timezone }}" class="truncate">{{ timezone }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="time" class="block text-lg">Time (HH:MM)</label>
                <input type="text" id="time" name="time" class="w-full p-2 border border-gray-300 rounded" value="12:30">
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg">Convert</button>
        </form>
    </div>

    <!-- Result Display -->
    <div id="result" class="text-center py-6 hidden">
        <h2 class="text-2xl font-semibold" id="convertedTime"></h2>
        <div id="clockFromZone" class="relative inline-block w-48 h-48 mt-6"></div>
        <div id="clockToZone" class="relative inline-block w-48 h-48 mt-6"></div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
