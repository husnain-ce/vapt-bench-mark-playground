{% extends "base.html" %}

{% block title %}Login | Nightbyte{% endblock %}

{% block content %}
<section class="auth-shell">
    <form class="auth-card" method="post" action="{{ url_for('auth.login') }}">
        <p class="eyebrow">Login</p>
        <h1>Return to the launcher.</h1>
        <input type="text" name="username" placeholder="Username" autocomplete="username">
        <input type="password" name="password" placeholder="Password" autocomplete="current-password">
        <button type="submit">Enter Nightbyte</button>
        <p class="auth-alt">Need an account? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
    </form>
</section>
{% endblock %}
