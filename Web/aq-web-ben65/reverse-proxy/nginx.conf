server {
  listen 80;
  server_name web.localhost *.web.localhost;

  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;

  }
}

server {
  listen 80;
  server_name sandbox.localhost;

  location / {
    proxy_pass http://sandbox:80;
    proxy_set_header Host $host;
  }
}

