{% extends "base.html" %}
{% block title %}New Repository - HgHub{% endblock %}
{% block content %}
<h1>Create New Repository</h1>
<div class="card" style="max-width: 500px;">
    <form method="POST">
        <label for="name">Repository Name</label>
        <input type="text" id="name" name="name" required pattern="[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]">
        <small style="display: block; color: #6a737d; margin-bottom: 12px;">Letters, numbers, dots, underscores, hyphens only.</small>
        <button type="submit" class="btn">Create Repository</button>
    </form>
</div>
{% endblock %}
